<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wells Middle School Chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  h1 {
    font-size: 1rem;
    margin: 0;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #ddd;
    flex-shrink: 0;
  }
  #messages { flex: 1; overflow-y: auto; padding: 1rem; }
  .msg { margin-bottom: 1rem; line-height: 1.4; }
  .msg .role { font-weight: 600; display: block; margin-bottom: 0.25rem; }
  .msg.user .role { color: #1a73e8; }
  .msg.bot .role { color: #188038; }
  .msg.error .role { color: #d93025; }
  .msg .body p:first-child { margin-top: 0; }
  .msg .body p:last-child { margin-bottom: 0; }
  .msg.pending .body { color: #5f6368; font-style: italic; }
  #input-row { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; border-top: 1px solid #ddd; flex-shrink: 0; }
  #input-row input { flex: 1; padding: 0.5rem; font-size: 1rem; min-width: 0; }
  #input-row button { padding: 0.5rem 1rem; font-size: 1rem; }
  #input-row button:disabled { opacity: 0.6; }
</style>
</head>
<body>
  <h1>Wells Middle School Chat</h1>

  <div id="messages"></div>
  <div id="input-row">
    <input id="input" type="text" placeholder="Ask about Wells Middle School..." autocomplete="off">
    <button id="send">Send</button>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendEl = document.getElementById("send");

    function addMessage(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = "msg " + role;

      const roleEl = document.createElement("span");
      roleEl.className = "role";
      roleEl.textContent = role === "user" ? "You" : "Wells Bot";
      wrapper.appendChild(roleEl);

      const bodyEl = document.createElement("div");
      bodyEl.className = "body";
      if (role === "bot") {
        // Bot replies render as Markdown; sanitize before injecting since the
        // reply may echo untrusted content the agent scraped from the web.
        bodyEl.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        // User input and error/pending text are never rendered as Markdown/HTML.
        bodyEl.textContent = text;
      }
      wrapper.appendChild(bodyEl);

      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrapper;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      sendEl.disabled = true;
      addMessage("user", text);
      const pending = addMessage("pending", "Wells Bot is typing...");

      try {
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ message: text }),
        });
        pending.remove();
        if (!resp.ok) {
          const detail = resp.status === 429
            ? "You're sending messages too quickly. Please wait a moment and try again."
            : "Sorry, something went wrong (HTTP " + resp.status + "). Please try again.";
          addMessage("error", detail);
          return;
        }
        const data = await resp.json();
        addMessage("bot", data.reply);
      } catch (err) {
        pending.remove();
        addMessage("error", "Sorry, I couldn't reach the server. Check your connection and try again.");
      } finally {
        sendEl.disabled = false;
        inputEl.focus();
      }
    }

    sendEl.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
