<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<!-- PWA / iOS home-screen install support. `apple-mobile-web-app-capable` is
     iOS-specific (Android reads it from the linked manifest instead). Together
     these make the site behave like a standalone app once "Add to Home Screen"
     is tapped from Safari. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DUSD Chat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>School Chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --border: #d1d1d6;
    --text: #000000;
    --text-muted: #6e6e73;
    --user-bubble-bg: #007aff;
    --user-bubble-text: #ffffff;
    --bot-bubble-bg: #e5e5ea;
    --bot-bubble-text: #000000;
    --error-bubble-bg: #ffd7d5;
    --error-bubble-text: #7d0000;
    --link: #0060df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --border: #38383a;
      --text: #ffffff;
      --text-muted: #98989d;
      --user-bubble-bg: #0a84ff;
      --user-bubble-text: #ffffff;
      --bot-bubble-bg: #262629;
      --bot-bubble-text: #ffffff;
      --error-bubble-bg: #3a1618;
      --error-bubble-text: #ff8a80;
      --link: #6ea8ff;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    /* 100dvh (dynamic viewport) so the layout shrinks correctly when iOS
       Safari's keyboard opens — 100vh would leave the input hidden. */
    height: 100dvh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }

  header {
    display: grid;
    grid-template-columns: 60px 1fr 60px;
    align-items: center;
    padding: calc(env(safe-area-inset-top) + 10px) 12px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
    font-weight: 600;
    flex-shrink: 0;
  }
  header .title { text-align: center; }
  header .actions { text-align: right; }
  #install-btn {
    display: none;
    padding: 6px 10px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--user-bubble-bg);
    background: transparent;
    border: 1px solid var(--user-bubble-bg);
    border-radius: 999px;
    cursor: pointer;
  }
  #install-btn.visible { display: inline-block; }
  #install-btn:active { opacity: 0.6; }

  /* iOS-only install hint overlay — Safari doesn't expose a programmatic
     install prompt, so we show a small popover explaining Share → Add to
     Home Screen instead. */
  #ios-install-hint {
    position: fixed;
    left: 12px; right: 12px;
    top: calc(env(safe-area-inset-top) + 60px);
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    font-size: 0.9rem;
    line-height: 1.4;
    z-index: 10;
    display: none;
  }
  #ios-install-hint.visible { display: block; }
  #ios-install-hint .close {
    float: right;
    background: none;
    border: none;
    font-size: 1.2rem;
    color: var(--text-muted);
    cursor: pointer;
    margin: -6px -6px 0 8px;
  }
  #ios-install-hint kbd {
    display: inline-block;
    padding: 1px 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.85em;
  }

  #school-picker {
    display: none;
    gap: 8px;
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    justify-content: center;
    flex-shrink: 0;
  }
  #school-picker.visible { display: flex; }
  #school-picker label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    cursor: pointer;
    color: var(--text);
  }
  #school-picker input { accent-color: var(--user-bubble-bg); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 12px 4px;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }

  .msg {
    display: flex;
    margin-bottom: 8px;
    /* Slide-in animation is subtle enough that it doesn't feel gimmicky in a
       widget embed but adds a "message just arrived" cue in the standalone
       PWA. */
    animation: bubble-in 180ms ease-out;
  }
  @keyframes bubble-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0);   }
  }
  .msg.user { justify-content: flex-end; }
  .msg.bot, .msg.pending, .msg.error { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 8px 12px;
    border-radius: 18px;
    line-height: 1.35;
    font-size: 1rem;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble {
    background: var(--user-bubble-bg);
    color: var(--user-bubble-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble, .msg.pending .bubble {
    background: var(--bot-bubble-bg);
    color: var(--bot-bubble-text);
    border-bottom-left-radius: 4px;
  }
  .msg.error .bubble {
    background: var(--error-bubble-bg);
    color: var(--error-bubble-text);
    border-bottom-left-radius: 4px;
  }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble a { color: var(--link); }

  /* Typing indicator (three bouncing dots) — replaces "AI is typing..." text
     since bubble-side already implies who is speaking. */
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-muted);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0);   opacity: 0.5; }
    30%           { transform: translateY(-4px); opacity: 1;   }
  }

  #input-row {
    display: flex;
    gap: 8px;
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 8px);
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    font-size: 1rem;
    /* Prevent iOS Safari's auto-zoom on focus; requires the font-size >= 16px
       above (it is 1rem = 16px). */
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  #input:focus { border-color: var(--user-bubble-bg); }
  #send {
    /* Circular icon button — 40x40 keeps thumb-friendly hit area while
       staying visually compact. */
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--user-bubble-bg);
    color: var(--user-bubble-text);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }
  #send svg { width: 20px; height: 20px; fill: currentColor; }
</style>
</head>
<body>
  <header>
    <div></div>
    <div class="title">School Chat</div>
    <div class="actions">
      <button id="install-btn" type="button" aria-label="Install app">Install</button>
    </div>
  </header>

  <div id="ios-install-hint" role="dialog" aria-labelledby="ios-install-title">
    <button class="close" type="button" aria-label="Dismiss">×</button>
    <div id="ios-install-title" style="font-weight: 600; margin-bottom: 6px;">Install this app</div>
    <div>
      Tap the <strong>Share</strong> icon <span aria-hidden="true">⬆︎</span> at the bottom
      of Safari, then choose <kbd>Add to Home Screen</kbd>.
    </div>
  </div>

  <!-- Only visible when the embed didn't pin a school via ?school=. Real
       embeds (embed/wms-chatbot.js) always set the query param, so the picker
       is a dev/testing convenience. -->
  <div id="school-picker">
    <label><input type="radio" name="school" value="wells" checked> Wells Middle</label>
    <label><input type="radio" name="school" value="dhs"> Dublin High</label>
  </div>

  <div id="messages"></div>

  <div id="input-row">
    <input id="input" type="text" placeholder="Ask a question..." autocomplete="off"
           autocapitalize="sentences" enterkeyhint="send">
    <button id="send" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <script>
    // Install-button wiring. Two separate flows because iOS Safari refuses to
    // implement the standard beforeinstallprompt API — so on iPhone we can't
    // trigger the install sheet programmatically and have to show a manual
    // hint instead. Everywhere else (Android Chrome, desktop Chrome/Edge) we
    // capture the browser's deferred prompt and fire it on click.
    (function wireInstallButton() {
      const btn = document.getElementById("install-btn");
      const iosHint = document.getElementById("ios-install-hint");
      const iosHintClose = iosHint.querySelector(".close");

      // If already running as an installed PWA, hide the button entirely —
      // no point offering "install" to someone already inside the app.
      const isStandalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
      if (isStandalone) return;

      const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) && !window.MSStream;

      let deferredPrompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        // Chrome/Edge/Android: prevent the mini-infobar; we'll trigger the
        // real prompt from our own button so users get a discoverable action
        // instead of an easy-to-miss browser banner.
        e.preventDefault();
        deferredPrompt = e;
        btn.classList.add("visible");
      });

      // iOS Safari never fires beforeinstallprompt, so show the button up
      // front and route its click to the manual instructions overlay.
      if (isIOS) btn.classList.add("visible");

      btn.addEventListener("click", async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          deferredPrompt = null;
          if (outcome === "accepted") btn.classList.remove("visible");
        } else if (isIOS) {
          iosHint.classList.add("visible");
        }
      });

      iosHintClose.addEventListener("click", () => iosHint.classList.remove("visible"));

      // If the install completes (Chrome's `appinstalled` event), hide the
      // button so it doesn't stick around post-install on a stale tab.
      window.addEventListener("appinstalled", () => {
        btn.classList.remove("visible");
        deferredPrompt = null;
      });
    })();

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendEl = document.getElementById("send");
    const schoolPickerEl = document.getElementById("school-picker");

    const schoolRadios = Array.from(schoolPickerEl.querySelectorAll('input[name="school"]'));

    let schoolId = new URLSearchParams(window.location.search).get("school");
    const matchingRadio = schoolId && schoolRadios.find((r) => r.value === schoolId);
    if (matchingRadio) {
      matchingRadio.checked = true;
    } else {
      schoolPickerEl.classList.add("visible");
      schoolId = schoolRadios.find((r) => r.checked).value;
    }
    schoolPickerEl.addEventListener("change", (e) => {
      schoolId = e.target.value;
    });

    function addMessage(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = "msg " + role;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (role === "bot") {
        // Bot replies render as Markdown; sanitize before injecting since the
        // reply may echo untrusted content the agent scraped from the web.
        bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
        // Open links (e.g. the "📍 Source:" citation) in a new tab instead of
        // navigating away from the chat.
        bubble.querySelectorAll("a").forEach((a) => {
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        });
      } else if (role === "pending") {
        // Typing indicator: three bouncing dots replace the old "AI is typing"
        // text — bubble side already tells the user who is "speaking".
        bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
      } else {
        // User input + error text are never rendered as Markdown/HTML.
        bubble.textContent = text;
      }
      wrapper.appendChild(bubble);

      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrapper;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      sendEl.disabled = true;
      addMessage("user", text);
      const pending = addMessage("pending", "");

      try {
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(schoolId ? { message: text, school_id: schoolId } : { message: text }),
        });
        pending.remove();
        if (!resp.ok) {
          const detail = resp.status === 429
            ? "You're sending messages too quickly. Please wait a moment and try again."
            : "Sorry, something went wrong (HTTP " + resp.status + "). Please try again.";
          addMessage("error", detail);
          return;
        }
        const data = await resp.json();
        addMessage("bot", data.reply);
      } catch (err) {
        pending.remove();
        addMessage("error", "Sorry, I couldn't reach the server. Check your connection and try again.");
      } finally {
        sendEl.disabled = false;
        inputEl.focus();
      }
    }

    sendEl.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
