name: docker-build

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - ".github/workflows/docker-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: wms-chatbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
